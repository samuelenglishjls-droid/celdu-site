<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>셀듀 연차관리</title>
<style>
html,body{margin:0;height:100%;background:#fff}
iframe{display:block;border:0;width:100%;height:100%}
.msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:14px -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#888;z-index:-1;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="msg" id="msg">불러오는 중…</div>
<script>
// 셀듀 연차관리 웹앱(Apps Script)을 celdu.net/hr/pto 주소로 보여주는 페이지.
// 데이터는 이 저장소에 없고 Google 시트에만 있다. 로그인 앱이 #t=티켓 을 붙여 돌려보내면, 주소창에서 지운 뒤 웹앱에 넘긴다.
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycby36pbQClkHgSHFGjZGCDwNAqlppgLJ8pz9qZflVaeF2XqjX2FpyJfOci3h15mEFa0IHQ/exec'; // "셀듀 연차관리 웹앱"
  if (!EXEC) { document.getElementById('msg').innerHTML = '셀듀 연차관리 — 준비 중입니다.'; return; }
  var m = location.hash.match(/^#t=([^&]+)/);
  var src = EXEC + '?embed=pto' + (m ? '&t=' + m[1] : '');
  if (location.hash) history.replaceState(null, '', location.pathname);
  var f = document.createElement('iframe');
  f.src = src;
  f.title = '셀듀 연차관리';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
