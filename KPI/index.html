<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인사평가 대시보드</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:15px -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#333;background:#f5f6f8}
.box{background:#fff;border-radius:12px;padding:32px 28px;max-width:380px;width:90%;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center}
h1{font-size:19px;margin:0 0 6px}
p.sub{color:#777;font-size:13px;margin:0 0 22px}
a.btn{display:block;padding:14px;margin:10px 0;border-radius:8px;text-decoration:none;font-weight:600;background:#1f3864;color:#fff}
a.btn.alt{background:#fff;color:#1f3864;border:1px solid #1f3864}
.note{color:#888;font-size:12px;line-height:1.6;margin-top:18px;text-align:left}
</style>
</head>
<body>
<!-- celdu.net/kpi → 인사평가 대시보드(Apps Script 웹앱, 보는 사람 권한으로 실행).
셀듀 계정은 /a/macros/celdu.net/ 주소, 외부 Google 계정(gmail)은 /macros/ 주소로만 열려서 선택 화면을 둠. -->
<div class="box">
<h1>인사평가 대시보드</h1>
<p class="sub">로그인할 계정을 선택하세요</p>
<a class="btn" href="https://script.google.com/a/macros/celdu.net/s/AKfycbxo8aojftRORxfHBplo-ygZVsJhvcRvH23VUpEurFkZ_c_z9eXJjWUk4aHdDkIKaf91/exec">셀듀 계정 (@celdu.net)</a>
<a class="btn alt" href="https://script.google.com/macros/s/AKfycbxo8aojftRORxfHBplo-ygZVsJhvcRvH23VUpEurFkZ_c_z9eXJjWUk4aHdDkIKaf91/exec">개인 Google 계정 (gmail 등)</a>
<div class="note">개인 계정으로 "현재 파일을 열 수 없습니다"가 나오면, 브라우저에 여러 Google 계정이 로그인되어 있기 때문입니다. 시크릿 창에서 개인 계정 하나로만 로그인해 열어 주세요.</div>
</div>
</body>
</html>
